<!--
Contiene información del estilo de un documento o parte del documento. Contiene CSS, que es aplicado al contenido del
documento que contiene este elemento.
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- define los estilos interno al documento -->
    <style>
      div {
        background-color: red;
        padding: 20px;
        border-radius: 5px;
      }
      h1 {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1>Bienvenido a mi sitio web</h1>
    <div>
      <a href="home">Home</a>
      <a href="contact">Contact</a>
      <a href="about">About</a>
    </div>
  </body>
</html>
