<!--
El elemento <base> especifica la dirección URL base que se utilizará para todas las direcciones URL relativas 
contenidas dentro de un documento. Sólo puede haber un elemento como este en un documento.
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <base href="https://www.example.com/" target="_blank" />
  </head>
  <body>
    <div>
      <a href="home">Home</a>
      <a href="contact">Contact</a>
      <a href="about">About</a>
    </div>
  </body>
</html>
