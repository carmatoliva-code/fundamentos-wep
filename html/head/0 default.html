<!--
la etiqueta <Doctype> se utiliza para declarar el tipo de documento y la versión de HTML que se esta utilizando.
la etiqueta <html> es el contenedor principal de todo el contenido de la pagina web
la etiqueta <head> se utiliza para contener informacion sobre el documento HTML, como el titulo los metadatos y los enlaces a hojas de estilo y scripts.
la etiqeuta <title> se utiliza para definir el titulo del documento HTML, que se muestra en la barra de titulo del navegador y en los resultados de busqueda.
La etiqueta <body> en HTML sirve para albergar todo el contenido visible de una página web que el usuario puede ver e interactuar en su navegador
-->








<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
